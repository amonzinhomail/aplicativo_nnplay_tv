<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Admin · Banners</title>
<link rel="stylesheet" href="/admin/admin.css">
<script src="/admin/admin.js" defer></script>
</head>
<body>
<section id="login" class="login" hidden>
  <form id="loginForm">
    <h1>Administração</h1>
    <label>Senha<input type="password" id="pw" autocomplete="current-password" required autofocus></label>
    <button class="primary">Entrar</button>
    <p id="loginErr" class="err" role="alert"></p>
  </form>
</section>

<main id="app" hidden>
  <header>
    <h1>Banners</h1>
    <div>
      <a href="/" target="_blank" class="btn">Ver site</a>
      <button id="add" class="btn primary">+ Novo banner</button>
      <button id="logout" class="btn">Sair</button>
    </div>
  </header>
  <p id="msg" class="msg" role="status"></p>
  <div id="list"></div>
</main>
</body>
</html>
